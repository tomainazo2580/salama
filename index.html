<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0e7a5f">
  <title>Salama</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header id="entete">
  <h1>🛡️ Salama</h1>
  <button id="btnTheme" onclick="basculerTheme()">🌙</button>
</header>

<main>

  <!-- ACCUEIL -->
  <section id="page-accueil" class="page">
    <div id="banniere" class="cache">
      <span>📲 Installe Salama sur ton téléphone</span>
      <div class="banniere-btns">
        <button id="btnInstaller">Installer</button>
        <button id="btnFermerBanniere">✕</button>
      </div>
    </div>

    <p id="profilActifAccueil" class="profil-actif"></p>

    <div class="grille">
      <button class="tuile t-vert" onclick="aller('symptomes')">🩺<span>Symptômes</span></button>
      <button class="tuile t-bleu" onclick="aller('medocs')">💊<span>Médicaments</span></button>
      <button class="tuile t-violet" onclick="aller('journal')">📓<span>Journal</span></button>
      <button class="tuile t-orange" onclick="aller('profils')">👤<span>Profils</span></button>
    </div>

    <p class="version">Salama v0.11</p>
  </section>

  <!-- SYMPTÔMES -->
  <section id="page-symptomes" class="page cache">
    <h2>Que ressens-tu ?</h2>
    <div class="champs-ligne">
      <label>Depuis
        <select id="duree">
          <option value="aujourd'hui">Aujourd'hui</option>
          <option value="2-3 jours">2-3 jours</option>
          <option value="1 semaine ou +">1 semaine ou +</option>
        </select>
      </label>
      <label>Intensité
        <select id="intensite">
          <option value="légère">Légère</option>
          <option value="modérée">Modérée</option>
          <option value="forte">Forte</option>
        </select>
      </label>
    </div>
    <div id="listeSymptomes"></div>
    <button id="btnAnalyser" class="btn-principal" onclick="analyser()">Analyser</button>
    <div id="resultats"></div>
  </section>
    <!-- MÉDICAMENTS -->
  <section id="page-medocs" class="page cache">
    <h2>Médicaments</h2>
    <p id="medocsProfil" class="profil-actif"></p>
    <div id="listeMedocs"></div>
    <div id="ficheMedoc" class="cache"></div>
  </section>

  <!-- JOURNAL -->
  <section id="page-journal" class="page cache">
    <h2>Journal de santé</h2>
    <div id="listeJournal"></div>
  </section>

  <!-- PROFILS -->
  <section id="page-profils" class="page cache">
    <h2>Profils</h2>
    <div id="listeProfils"></div>
    <button id="btnNouveauProfil" class="btn-principal" onclick="nouveauProfil()">＋ Nouveau profil</button>
    <div id="formProfil" class="cache">
      <input id="pPrenom" placeholder="Prénom">
      <input id="pNaissance" type="number" placeholder="Année de naissance (ex : 1990)">
      <input id="pPoids" type="number" placeholder="Poids en kg (ex : 70)">
      <input id="pAllergies" placeholder="Allergies (ex : ibuprofène, aspirine)">
      <input id="pTraitements" placeholder="Traitements en cours (ex : cortisone)">
      <button class="btn-principal" onclick="enregistrerProfil()">Enregistrer</button>
    </div>
  </section>

</main>

<nav id="navBas">
  <button onclick="aller('accueil')">🏠<span>Accueil</span></button>
  <button onclick="aller('symptomes')">🩺<span>Symptômes</span></button>
  <button onclick="aller('medocs')">💊<span>Médocs</span></button>
  <button onclick="aller('journal')">📓<span>Journal</span></button>
  <button onclick="aller('profils')">👤<span>Profils</span></button>
</nav>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
