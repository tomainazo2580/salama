<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e7a5f">
  <title>Salama</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🩺 Salama</h1>
    <p id="sous-titre">Ton assistant santé personnel</p>
  </header>

  <main>
    <!-- ===== ACCUEIL ===== -->
    <section id="page-accueil" class="page active">
      <div class="grille">
        <button class="tuile t-symptomes" onclick="aller('symptomes')">
          <span class="emoji">🤒</span>
          <strong>Symptômes</strong>
          <span class="statut">Analyser</span>
        </button>
        <button class="tuile t-journal" onclick="aller('journal')">
          <span class="emoji">📓</span>
          <strong>Journal</strong>
          <span class="statut">Historique santé</span>
        </button>
        <button class="tuile t-medocs" onclick="aller('medicaments')">
          <span class="emoji">💊</span>
          <strong>Médicaments</strong>
          <span class="statut">Ma pharmacie</span>
        </button>
        <button class="tuile t-profils" onclick="aller('profils')">
          <span class="emoji">👥</span>
          <strong>Profils</strong>
          <span class="statut">Ma famille</span>
        </button>
      </div>
      <p class="version">Salama v0.6 — données 100% locales</p>
    </section>

    <!-- ===== JOURNAL ===== -->
    <section id="page-journal" class="page">
      <div id="journal-profil" class="badge-profil"></div>
      <button class="btn-principal" onclick="ouvrirFormulaire()">＋ Nouvelle entrée</button>
      <div id="liste-journal"></div>
    </section>

    <!-- ===== SYMPTÔMES ===== -->
    <section id="page-symptomes" class="page">

      <!-- Étape A : sélection -->
      <div id="sym-selection">
        <div id="sym-profil" class="badge-profil"></div>
        <input type="text" id="recherche-symptome" class="champ-recherche"
               placeholder="🔍 Rechercher un symptôme..." oninput="filtrerSymptomes()">
        <div id="liste-symptomes"></div>

        <div class="bloc-options">
          <label>Depuis quand ?</label>
          <select id="sym-duree">
            <option value="aujourd'hui">Aujourd'hui</option>
            <option value="1-2 jours" selected>1-2 jours</option>
            <option value="3-5 jours">3-5 jours</option>
            <option value="plus d'une semaine">Plus d'une semaine</option>
          </select>
          <label>Intensité globale</label>
          <div class="intensite">
            <button class="niv" data-val="1">1</button>
            <button class="niv" data-val="2">2</button>
            <button class="niv selectionnee" data-val="3">3</button>
            <button class="niv" data-val="4">4</button>
            <button class="niv" data-val="5">5</button>
          </div>
        </div>

        <button class="btn-principal btn-analyser" onclick="analyser()">
          Analyser (<span id="compteur-symptomes">0</span> symptôme<span id="pluriel">s</span>)
        </button>
      </div>

      <!-- Étape B : résultat -->
      <div id="sym-resultat" class="cache"></div>

    </section>

    <!-- ===== MÉDICAMENTS ===== -->
    <section id="page-medicaments" class="page">
      <div class="vide"><span class="gros">💊</span>Les médicaments arrivent à l'étape 5.</div>
    </section>

    <!-- ===== PROFILS ===== -->
    <section id="page-profils" class="page">
      <button class="btn-principal" onclick="ouvrirFormProfil()">＋ Nouveau profil</button>
      <div id="liste-profils"></div>
    </section>
  </main>

  <!-- ===== Formulaire journal ===== -->
  <div id="formulaire-journal" class="modal cache">
    <div class="modal-contenu">
      <h2>Nouvelle entrée</h2>
      <label>Comment te sens-tu ?</label>
      <div class="humeurs">
        <button class="humeur" data-val="1">😫</button>
        <button class="humeur" data-val="2">😕</button>
        <button class="humeur" data-val="3">😐</button>
        <button class="humeur" data-val="4">🙂</button>
        <button class="humeur" data-val="5">😄</button>
      </div>
      <label>Symptômes (séparés par des virgules)</label>
      <input type="text" id="f-symptomes" placeholder="fièvre, toux, fatigue...">
      <label>Notes</label>
      <textarea id="f-notes" rows="3" placeholder="Détails, contexte..."></textarea>
      <div class="modal-actions">
        <button class="btn-secondaire" onclick="fermerFormulaire()">Annuler</button>
        <button class="btn-principal" onclick="sauvegarderEntree()">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- ===== Formulaire profil ===== -->
  <div id="formulaire-profil" class="modal cache">
    <div class="modal-contenu">
      <h2>Nouveau profil</h2>
      <label>Prénom *</label>
      <input type="text" id="p-prenom" placeholder="Ex : Awa">
      <label>Année de naissance *</label>
      <input type="number" id="p-annee" placeholder="Ex : 1990">
      <label>Poids (kg) *</label>
      <input type="number" id="p-poids" placeholder="Ex : 65">
      <label>Allergies connues</label>
      <input type="text" id="p-allergies" placeholder="Ex : pénicilline, arachides...">
      <label>Traitements en cours</label>
      <input type="text" id="p-traitements" placeholder="Ex : ventoline, ...">
      <div class="modal-actions">
        <button class="btn-secondaire" onclick="fermerFormProfil()">Annuler</button>
        <button class="btn-principal" onclick="sauvegarderProfil()">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- ===== Navigation du bas ===== -->
  <nav class="nav-bas">
    <button class="actif" data-page="accueil" onclick="aller('accueil')">
      <span class="ico">🏠</span>Accueil
    </button>
    <button data-page="journal" onclick="aller('journal')">
      <span class="ico">📓</span>Journal
    </button>
    <button data-page="medicaments" onclick="aller('medicaments')">
      <span class="ico">💊</span>Médoc
    </button>
    <button data-page="profils" onclick="aller('profils')">
      <span class="ico">👥</span>Profils
    </button>
    <button onclick="basculerSombre()">
      <span class="ico" id="ico-sombre">🌙</span>Sombre
    </button>
  </nav>

  <!-- ===== Bannière d'installation ===== -->
  <div id="banniere" class="banniere cachee">
    <button id="fermer-banniere" aria-label="Fermer">✕</button>
    <div class="banniere-texte">
      <strong>Installer Salama</strong>
      <span id="banniere-detail">Accès rapide depuis ton écran d'accueil</span>
    </div>
    <button id="bouton-installer">Installer</button>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
